name: Deploy hc-component-dev to GitHub Pages

on:
  push:
    branches:
      - main-new
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Remove problematic patches for deployment
        run: |
          # Backup original package.json
          cp package.json package.json.bak
          # Remove patches that are not needed for hc-component
          node -e "const fs=require('fs');const pkg=JSON.parse(fs.readFileSync('package.json'));delete pkg.pnpm.patchedDependencies['@testing-library/vue'];delete pkg.pnpm.patchedDependencies['vue-gtag-next'];fs.writeFileSync('package.json',JSON.stringify(pkg,null,2));"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build hc-component dev
        run: |
          cd packages/hc-component/dev
          pnpm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/hc-component/dev/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

